# Mirrors the ros:<distro> base images this project's CI builds on into the org's GHCR namespace.
#
# Docker Hub limits anonymous pulls per source IP. The CI matrix pulls a base image well over a
# hundred times per run - from hosted runners whose egress IP is shared with every other customer,
# and from a self-hosted runner with one fixed IP - so it is throttled by a limit it has no way to
# influence. Pulling from GHCR instead removes that dependency from the critical path entirely: the
# images are in the same org as the repository and are pulled with the built-in GITHUB_TOKEN.

name: Mirror ROS base images

on:
  schedule:
    # Weekly. The upstream tags are rebuilt for security updates, so the mirror is refreshed rather
    # than populated once and forgotten.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Mirror ros:${{matrix.ros}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros: [humble, iron, jazzy, kilted, lyrical]
    env:
      # Passed through the environment rather than interpolated into the shell, so nothing from the
      # event context is ever parsed as script.
      GHCR_USER: ${{github.actor}}
      GHCR_TOKEN: ${{secrets.GITHUB_TOKEN}}
      SOURCE_IMAGE: docker.io/library/ros:${{matrix.ros}}
      MIRROR_IMAGE: ghcr.io/${{github.repository_owner}}/ros:${{matrix.ros}}
    steps:
      - name: Log in to GHCR
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Copy the base image to GHCR
        # imagetools copies the whole manifest list, every architecture included. A plain
        # `docker pull` + `docker push` would copy only the architecture of the runner doing the
        # mirroring, which would leave the arm64 self-hosted runner unable to pull its own.
        run: docker buildx imagetools create --tag "${MIRROR_IMAGE}" "${SOURCE_IMAGE}"

      - name: Show what landed
        run: docker buildx imagetools inspect "${MIRROR_IMAGE}"
